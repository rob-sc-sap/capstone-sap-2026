_schema-version: 3.3.0
ID: vendor-selection
version: 1.0.0
description: "A simple CAP project."

modules:
- name: vendor-selection-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: vendor-selection-db
  - name: app-frontend-shared-destination-service
  - name: vendor-selection-auth
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci

- name: vendor-selection-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: vendor-selection-db
  parameters:
    buildpack: nodejs_buildpack

- name: vendor-selection-destinations
  type: com.sap.application.content
  requires:
  - name: vendor-selection-auth
    parameters:
      service-key:
        name: vendor-selection-auth-key
  - name: srv-api
  - name: app-frontend-shared-destination-service
    parameters:
      content-target: true
  parameters:
    content:
      subaccount:
        destinations:
          - Name: vendor-selection-srv
            URL: ~{srv-api/srv-url}
            Authentication: OAuth2UserTokenExchange
            TokenServiceInstanceName: vendor-selection-auth
            TokenServiceKeyName: vendor-selection-auth-key
            sap.cloud.service: vendorselection.service
        existing_destinations_policy: update
  build-parameters:
    no-source: true

resources:

- name: vendor-selection-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared

- name: app-frontend-shared-destination-service
  type: org.cloudfoundry.existing-service
  parameters:
    service-name: app-frontend-shared-destination-service

- name: vendor-selection-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: vendor-selection-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production